# Data and task configuration
data: "./data/winobias-mistral-7b-i-05__24_28_32_42"
tokenwise: false
disable_marks: true
mark_prompt_nodes: false
mark_start_prompt: false
mark_prompt_edges: true
attention_threshold: 0.05
llm_layers: "all" 

# Training configuration
num_epochs: 75
patience: 20
learning_rate: 0.0005
scheduler: "plateau"
balance: false
batch_size: 32
eval_prebatch: false
train_prebatch: false
train_prebatch_interval: 10  # NOTE: Irrelevant given line above

# Regularisation hypers
dropout_rate: 0.25
weight_decay: 0.0
weight_decay_target: "attr_encoders.act"
weight_decay_for_target: 0.05

# Architectural hypers
hidden_dim: 32
num_layers: 2
flow: "source_to_target"
readout: "mean"
aggr: "mean"
activation: "none"
layer: "custom"
encoder: "linear"
batch_norm: "no"
residual: "yes"
attr_encoder_location: "beginning"
cat_attr: "yes"

# Additional artefacts
on_x: false
# -- white box   
acts: "./data/winobias-mistral-7b-i-05__24_28_32_42/raw/all_acts.pt"
act_llm_layers: "24"

# Logging
log: false
verbose: false

# Checkpointing
checkpoint_folder: './checkpoints'
checkpoint_best: true

# Training with data on disk
dump_data_only: false
on_disk: true




